name: Actualizar puntos de donación

on:
  schedule:
    - cron: "17 5 * * *"   # todos los días, 05:17 UTC
  workflow_dispatch: {}      # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Leer la web y actualizar los datos
        run: python scripts/update.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar puntos de donación"
            git push
          fi
